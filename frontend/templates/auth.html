<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=WDXL+Lubrifont+TC&display=swap" rel="stylesheet">
    <link href="../static/css/auth.css" rel="stylesheet"/> 


</head>

    <body>
        <img src="../static/images/background_screen.avif" class="bg-img"/>
        <div class="content-wrapper">
                <input type="checkbox" id="form-switch" class="toggle-checkbox">

                <section id="login" class="loginsection">

                    <h2>Войдите в аккаунт!</h2>

                    <form class="loginform">
                        <label for="email_login" class="login">Почта</label>
                        <input type="email" id="email_login" class="login" placeholder="Введите почту"/>
                        <label for="password_login" class="login">Пароль</label>
                        <input type="text" id="password_login" class="login" placeholder="Введите пароль"/>
                    </form>

                    <button id="login_button" class="button">Войти</button>
                    <label for="form-switch" class="switch-button">Зарегистрироваться.</label>
                    
                </section>

                <section id="registration" class="loginsection hidden">

                    <h2>Создайте аккаунт!</h2>
                    <form class="reg-form">
                        <label for="name-reg" class="reg">ФИО</label>
                        <input type="text" id="name-reg" class="reg" placeholder="Введите Ваше ФИО">

                        <label for="email-reg" class="reg">Почта</label>
                        <input type="email" id="email-reg" class="reg" placeholder="Введите почту"/>

                        <label for="pass-reg" class="reg">Пароль</label>
                        <input type="text" id="pass-reg" class="reg" placeholder="Введите пароль">
                        
                        <label for="pass-sec-reg" class="reg">Пароль</label>
                        <input type="text" id="pass-sec-reg" class="reg" placeholder="Повторите пароль">

                    </form>

                    <button id="login_button" class="button">Зарегистрироваться</button>
                    <label for="form-switch" class="switch-button">Войти в аккаунт.</label>

                </section>
        </div>
    </body>

</html>
