<section class="storage-page">

    <div class="discription-storage discription">
        <h2 class="storage-page-discription page-discription">Содержимое склада: запчасти и расходники</h2>
    </div>

    <div class="storage-container tcontainer">
        <table class="storage-table table">
            <thead>
                <tr>
                    <th>Наименование</th>
                    <th>Количество</th>
                    <th>Дата поставки</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody class="storage-body tbody">

            </tbody>
        </table>
    </div>

    <template id="storage-row-template">
        <tr class="storage-row">
            <td class="part-name"></td>
            <td class="part-quantity"></td>
            <td class="part-delivery-date"></td>
            <td class="storage-actions">
                <div class="action-group">
                    <button type="button">Заказать</button>
                </div>
            </td>
        </tr>
    </template>

    <div class="storage-popup" hidden>
        <div class="storage-popup-backdrop"></div>

        <div class="storage-popup-card">
            <h3>Заказать позицию</h3>

            <form class="storage-order-form">
                <label>
                    Количество  
                    <input type="number" name="quantity" min="1" required>
                </label>

                <label>
                    Дата поставки
                    <input type="date" name="delivery_date" required>
                </label>

                <div class="storage-popup-actions">
                    <button type="button" class="storage-popup-cancel">Отмена</button>
                    <button type="submit">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</section>
